# Port this microservice listens on.
server.port=1112

# --- SMTP configuration ---
# Using Gmail here as an example. Swap host/port for another provider if you like.
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Pulled from environment variables at runtime - never commit real credentials.
# Default empty values let the app start so configuration issues are easier to diagnose.
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# --- App-specific settings, used in EmailService ---
app.mail.from-address=${MAIL_USERNAME:}
app.mail.from-name=Your App Contacts
