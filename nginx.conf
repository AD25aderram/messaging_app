events {}



http {
    
    server {
        listen 8080;

        location / {
            proxy_pass http://localhost:5173/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location /auth/ {
            proxy_pass http://localhost:2000/;
        }

        location /contacts/ {
            proxy_pass http://localhost:2222/;
        }

        location /contacts-id/ {
            proxy_pass http://localhost:2500/;
        }

        location /messages/ {
            proxy_pass http://localhost:2600/;
        }

        location /message-service/ {
            proxy_pass http://localhost:3001/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /email-service/ {
            proxy_pass http://localhost:2333/;
        }

        location /java-service/ {
            # strip the /java-service prefix and proxy the remainder to the Java service
            rewrite ^/java-service(/.*)$ $1 break;
            proxy_pass http://127.0.0.1:1112;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }
    }
    
}